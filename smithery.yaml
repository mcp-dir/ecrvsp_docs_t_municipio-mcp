# Smithery configuration for ECRVSP Documentos Transferência de Município: Estado
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_ecrvsp_docs_t_municipio

name: ecrvsp_docs_t_municipio-mcp
displayName: "ECRVSP Documentos Transferência de Município: Estado"
description: >
  ECRVSP Documentos Transferência de Município: Estado, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/ecrvsp_docs_t_municipio-mcp
repository: https://github.com/mcp-dir/ecrvsp_docs_t_municipio-mcp

tags:
  - ecrvsp_docs_t_municipio
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_ecrvsp_docs_t_municipio

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_ecrvsp_docs_t_municipio/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
